<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tarif assurance vie (React)</title>
  <style>
    :root {
      --bg-1: #06182a;
      --bg-2: #0b2b46;
      --bg-3: #123a5a;
      --card: #f8fafc;
      --text: #0b1620;
      --muted: #5c6b77;
      --accent: #1f5a93;
      --accent-2: #c7d8eb;
      --line: #d7dde4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(145deg, var(--bg-1), var(--bg-2), var(--bg-3));
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--text);
    }
    .frame {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
      position: relative;
      overflow: hidden;
    }
    .frame::before {
      content: "";
      position: absolute;
      inset: -40% -30% auto auto;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle at 40% 40%, rgba(199,216,235,.45), transparent 65%);
      pointer-events: none;
    }
    h1 {
      font-family: "Merriweather", "Times New Roman", serif;
      font-size: 26px;
      margin: 0 0 6px;
      letter-spacing: .2px;
    }
    h2 {
      font-size: 18px;
      margin: 20px 0 8px;
    }
    p.sub {
      margin: 0 0 18px;
      color: var(--muted);
    }
    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr 1fr;
    }
    .item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      background: #fff;
    }
    .label { color: var(--muted); font-size: 13px; }
    .value { font-weight: 700; font-size: 16px; }
    .tariff {
      display: flex;
      align-items: baseline;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      background: #fff;
    }
    .tariff .amount {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent);
    }
    .conditions {
      white-space: pre-wrap;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      font-size: 14px;
      color: #27323a;
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

  <script>
    window.__APP_DATA__ = __APP_DATA__;
  </script>

  <script type="text/babel">
    const data = window.__APP_DATA__;

    function App() {
      return (
        <div className="frame">
          <h1>Votre proposition d'assurance vie</h1>
          <p className="sub">Synthese de votre profil et tarif estime.</p>

          <h2>Profil client</h2>
          <div className="grid">
            <div className="item"><div className="label">Age</div><div className="value">{data.age} ans</div></div>
            <div className="item"><div className="label">Versement initial</div><div className="value">{data.versement_initial} EUR</div></div>
            <div className="item"><div className="label">Duree d'investissement</div><div className="value">{data.duree_investissment} ans</div></div>
            <div className="item"><div className="label">Niveau de risque</div><div className="value">{data.niveau_risque}/10</div></div>
          </div>

          <h2>Tarif</h2>
          <div className="tariff">
            <div className="amount">{data.premium} EUR / mois</div>
            <div className="label">Tarif estime, a ajuster selon votre conseiller.</div>
          </div>

          <h2>Conditions generales</h2>
          <div className="conditions">{data.conditions_generales}</div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
